# An edit of a .docx with neither -o nor --in-place writes NAME.edited.docx beside it and leaves the input as it was.
bin.name = "stetdoc"
args = ["edit", "contract.docx", "--author", "Jane Doe"]
stdin = """
base: 5737b772923cf8d3:0:5737b772923cf8d3
---
@replace
ref: p4
find: thirty
with: sixty
"""
status.code = 0
fs.sandbox = true
